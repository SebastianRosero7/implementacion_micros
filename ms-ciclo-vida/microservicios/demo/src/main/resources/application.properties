spring.application.name=demo
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/ciclo_vida}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ciclo_vida}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ciclo_vida}
spring.datasource.hikari.initialization-fail-timeout=60000
spring.flyway.enabled=true

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.default-requeue-rejected=false

integracion.banco-preguntas.grpc.address=${GRPC_CLIENT_BANCO_PREGUNTAS_ADDRESS:localhost:50051}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
